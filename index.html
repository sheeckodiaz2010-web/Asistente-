<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Asistente IA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: #0c0c0e;
      color: #f5f5f7;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 16px;
      border-bottom: 1px solid #2c2c2e;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 24px; height: 24px; color: white; }
    .title h1 { font-size: 17px; font-weight: 600; }
    .title p { font-size: 12px; color: #8e8e93; margin-top: 1px; }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }
    .action-btn {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      border-radius: 14px;
      padding: 12px 4px;
      color: #f5f5f7;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }
    .action-btn:active { transform: scale(0.96); background: #2c2c2e; }
    .action-btn svg { width: 24px; height: 24px; }
    .action-btn.imagen svg { color: #ff9f0a; }
    .action-btn.foto svg { color: #30d158; }
    .action-btn.ideas svg { color: #bf5af2; }
    .action-btn.regalos svg { color: #ff375f; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      white-space: pre-wrap;
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
    }
    .msg.user {
      background: #0a84ff;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 6px;
    }
    .msg.ai {
      background: #1c1c1e;
      border: 1px solid #2c2c2e;
      align-self: flex-start;
      border-bottom-left-radius: 6px;
    }
    .msg.system {
      color: #8e8e93;
      font-size: 13px;
      text-align: center;
      align-self: center;
    }
    .loading { display: flex; gap: 4px; padding: 12px 16px; }
    .dot {
      width: 7px; height: 7px;
      background: #8e8e93;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .input-area {
      padding: 12px 16px 20px;
      background: rgba(28, 28, 30, 0.9);
      border-top: 1px solid #2c2c2e;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #q {
      flex: 1;
      background: #1c1c1e;
      border: 1px solid #3a3a3c;
      border-radius: 22px;
      padding: 12px 18px;
      color: white;
      font-size: 16px;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 44px;
    }
    #q:focus { border-color: #0a84ff; }
    #send {
      width: 44px;
      height: 44px;
      background: #0a84ff;
      border: none;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #send:disabled { background: #3a3a3c; }
    #send svg { width: 20px; height: 20px; }
    #file { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <!-- Icono dulce -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 10 6 6"/><path d="m14 10-6 6"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
    </div>
    <div class="title">
      <h1>Asistente IA</h1>
      <p>Pregúntame lo que sea</p>
    </div>
  </header>

  <div class="actions">
    <button class="action-btn imagen" onclick="preguntaRapida('Explícame algo interesante que casi nadie sabe, de forma sencilla')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
      Explicar
    </button>

    <button class="action-btn foto" onclick="preguntaRapida('Ayúdame a redactar un mensaje claro y amable para...')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      Redactar
    </button>

    <button class="action-btn ideas" onclick="preguntaRapida('Dame 5 ideas creativas para un proyecto o negocio pequeño')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      Ideas
    </button>

    <button class="action-btn regalos" onclick="preguntaRapida('Ayúdame a resolver un problema paso a paso')">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
      Resolver
    </button>
  </div>

  <div id="chat">
    <div class="msg system">Hola 👋 Pregúntame lo que quieras: explicaciones, ideas, textos, código, traducciones…</div>
  </div>

  <div class="input-area">
    <textarea id="q" rows="1" placeholder="Escribe aquí..." oninput="autoResize(this)"></textarea>
    <button id="send" onclick="preguntar()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
    </button>
  </div>

  

  <script>
    function getKey() {
      let k = null;
      try { k = localStorage.getItem('groq_key'); } catch (e) {}
      if (!k) {
        k = (prompt('Pega tu clave de Groq (se guarda solo en este teléfono):') || '').replace(/[\s"']/g, '');
        if (k) { try { localStorage.setItem('groq_key', k); } catch (e) {} }
      }
      return k;
    }

    const historial = [];
    const chat = document.getElementById('chat');
    const input = document.getElementById('q');
    const sendBtn = document.getElementById('send');

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        preguntar();
      }
    });

    function addMsg(text, type = 'ai') {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showLoading() {
      const div = document.createElement('div');
      div.className = 'msg ai loading';
      div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function preguntar() {
      const q = input.value.trim();
      if (!q) return;

      const GROQ_KEY = getKey();
      if (!GROQ_KEY) { addMsg("Falta la clave de Groq.", 'ai'); return; }

      addMsg(q, 'user');
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;

      const loading = showLoading();

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + GROQ_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "openai/gpt-oss-20b",
            messages: [
              {
                role: "system",
                content: "Eres un asistente de IA amable, inteligente y muy capaz. Responde en el idioma del usuario (por defecto español). Sé claro, honesto y directo; explica paso a paso cuando ayude y admite cuando no sepas algo. Puedes ayudar con cualquier tema: dudas, escritura, ideas, estudio, código, traducciones, análisis y consejos prácticos."
              },
              ...historial.slice(-20), { role: "user", content: q }
            ],
            temperature: 0.7,
            reasoning_effort: "low",
            max_completion_tokens: 2000
          })
        });

        const data = await res.json();
        loading.remove();

        if (data.choices?.[0]) {
          const r = data.choices[0].message.content || '';
          historial.push({ role: 'user', content: q }, { role: 'assistant', content: r });
          addMsg(r, 'ai');
        } else {
          const msg = data.error?.message || JSON.stringify(data);
          if (res.status === 401) { try { localStorage.removeItem('groq_key'); } catch (e) {} }
          addMsg("Error " + res.status + ": " + msg, 'ai');
        }
      } catch (err) {
        loading.remove();
        addMsg("Error de conexión.", 'ai');
      }

      sendBtn.disabled = false;
      input.focus();
    }

    function preguntaRapida(texto) {
      input.value = texto;
      preguntar();
    }

  </script>
</body>
</html>
